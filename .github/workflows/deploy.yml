name: Build and deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
                - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static Next.js site
        run: npm run build
      - name: Check generated entry page
        run: test -s out/index.html
      - name: Upload built website
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-public-html
          path: out/
          if-no-files-found: error

  deploy:
    needs: build
    if: ${{ vars.ENABLE_HOSTINGER_FTP_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: hostinger-public-html
          path: out/
      - name: Publish site over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ vars.HOSTINGER_FTP_SERVER_DIR || '/public_html/' }}
          dangerous-clean-slate: false
